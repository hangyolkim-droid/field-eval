[package]
name = "field-eval"
version = "0.1.0-alpha.1"
edition = "2021"

[dependencies]
rig-core = "0.44"
rig-agent = "0.44"
rig-llama-cpp = "0.6"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1"
ratatui = "0.26"
crossterm = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[features]
default = []
vulkan = ["rig-llama-cpp/vulkan"]
openmp = ["rig-llama-cpp/openmp"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
